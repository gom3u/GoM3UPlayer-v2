<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Pinch-zoom disabled for touch & mobile usability -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart IPTV Web Player</title>

    <!-- hls.js CDN for live stream support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* ==========================================
           RESET & ESSENTIAL LAYOUT STYLES
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        /* Focus System with Blue Glow & Scale Animation */
        :focus, .remote-focusable:focus {
            outline: 3px solid #3b82f6 !important;
            outline-offset: 3px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8), 0 0 25px rgba(59, 130, 246, 0.4) !important;
            transform: scale(1.05) !important;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out, outline 0.15s ease-out !important;
            z-index: 100 !important;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            font-family: inherit;
        }

        /* ==========================================
           FULLSCREEN VIDEO PLAYER & BRIGHTNESS
           ========================================== */
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Default Aspect Ratio */
        }

        /* Brightness Overlay Simulation */
        #brightness-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            opacity: 0; /* Managed via JS (0 to 0.8) */
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.2s linear;
        }

        /* Aspect Ratio Class Overrides */
        .ar-fit { object-fit: contain !important; }
        .ar-fill { object-fit: cover !important; }
        .ar-stretch { object-fit: fill !important; }
        .ar-cover { object-fit: scale-down !important; }

        /* ==========================================
           GLASSMORPHISM COMMON STYLES
           ========================================== */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* ==========================================
           ON-SCREEN DISPLAY (OSD)
           ========================================== */
        #osd {
            position: absolute;
            top: clamp(20px, 5vh, 40px);
            left: clamp(20px, 5vw, 40px);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 20;
            opacity: 0;
            transform: translate3d(0, -20px, 0) scale(0.96);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            max-width: calc(100vw - 80px);
            will-change: opacity, transform;
        }

        #osd.show {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }

        #osd-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #3b82f6;
            min-width: 40px;
            text-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        #osd-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #osd-name {
            font-size: 1.15rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
        }

        /* ==========================================
           SIDE PANEL (CHANNEL LIST)
           ========================================== */
        #side-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: min(380px, 85vw);
            height: 100%;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            transform: translate3d(-100%, 0, 0);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 12px 0 36px rgba(0, 0, 0, 0.6);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            will-change: transform;
        }

        #side-panel.open {
            transform: translate3d(0, 0, 0);
        }

        .panel-header {
            padding: 20px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.2s, transform 0.15s, border-color 0.2s;
        }

        .btn-icon:hover {
            background: #3b82f6;
            border-color: #60a5fa;
        }

        /* Virtualized Scroll Container */
        #channel-list-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }

        #channel-list-spacer {
            width: 100%;
            position: relative;
        }

        .channel-item {
            position: absolute;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .channel-item.active {
            background: rgba(59, 130, 246, 0.85);
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .channel-item .ch-num {
            font-size: 0.9rem;
            font-weight: 700;
            opacity: 0.6;
            width: 35px;
        }

        .channel-item .ch-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-item .ch-name {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        /* ==========================================
           FLOATING GLASS NAVIGATION CONTROLS
           ========================================== */
        #floating-controls {
            position: absolute;
            bottom: clamp(16px, 4vh, 32px);
            left: 50%;
            transform: translate3d(-50%, 20px, 0) scale(0.96);
            padding: 8px 16px;
            border-radius: 32px;
            display: flex;
            gap: 8px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 95vw;
            overflow-x: auto;
            scrollbar-width: none;
            will-change: opacity, transform;
        }

        #floating-controls::-webkit-scrollbar { display: none; }

        #floating-controls.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate3d(-50%, 0, 0) scale(1);
        }

        .remote-btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: background 0.2s, transform 0.15s, border-color 0.2s;
        }

        .remote-btn:hover {
            background: #3b82f6;
            border-color: #60a5fa;
        }

        .remote-btn:active {
            transform: scale(0.96);
        }

        /* Floating Sliders (Volume & Brightness) */
        .slider-widget {
            position: absolute;
            bottom: clamp(75px, 12vh, 95px);
            left: 50%;
            transform: translate3d(-50%, 15px, 0) scale(0.95);
            padding: 12px 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .slider-widget.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate3d(-50%, 0, 0) scale(1);
        }

        .slider-widget input[type="range"] {
            width: 130px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .slider-widget span {
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 42px;
        }

        /* ==========================================
           PLAYLIST MANAGER GLASS MODAL
           ========================================== */
        #playlist-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #playlist-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%;
            max-width: 480px;
            padding: 28px;
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        #playlist-modal.open .modal-content {
            transform: scale(1);
        }

        .modal-content h3 {
            margin-bottom: 18px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-group input[type="text"]:focus {
            border-color: #3b82f6;
        }

        .playlist-select-list {
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        .playlist-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-primary { background: #3b82f6; border-color: #60a5fa; }
        .btn-danger { background: #ef4444; border-color: #f87171; }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.12); }

        .btn:hover {
            filter: brightness(1.1);
        }

        /* Exit Confirmation Dialog Styling */
        #exit-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        #exit-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* Status Animations & Indicator Overlay */
        #modal-status {
            display: none;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }
        #modal-status.loading { display: block; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        #modal-status.success { display: block; background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        #modal-status.error { display: block; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Custom File Input Styling */
        .file-input-wrapper {
            position: relative;
            width: 100%;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* ==========================================
           RESPONSIVE ADJUSTMENTS
           ========================================== */
        @media (max-width: 600px) {
            #osd { top: 20px; left: 20px; font-size: 0.9rem; }
            .remote-btn { padding: 6px 12px; font-size: 0.78rem; }
        }
    </style>
</head>
<body>

    <!-- VIDEO CONTAINER -->
    <div id="video-container">
        <video id="video" playsinline autopip autoplay muted></video>
        <div id="brightness-overlay"></div>
    </div>

    <!-- OSD (ON SCREEN DISPLAY) -->
    <div id="osd" class="glass-panel" aria-live="polite">
        <div id="osd-number">01</div>
        <img id="osd-logo" src="" alt="" style="display:none;">
        <div id="osd-name">Channel Name</div>
    </div>

    <!-- SIDE PANEL (CHANNELS) -->
    <div id="side-panel" role="dialog" aria-label="Channels Panel">
        <div class="panel-header">
            <h2 id="panel-title">Channels</h2>
            <div class="panel-actions">
                <button class="btn-icon remote-focusable" id="btn-playlists-modal" tabindex="0" aria-label="Playlists">Playlists</button>
                <button class="btn-icon remote-focusable" id="btn-close-panel" tabindex="0" aria-label="Close Channel List">✕</button>
            </div>
        </div>
        <div id="channel-list-container" tabindex="-1">
            <div id="channel-list-spacer"></div>
        </div>
    </div>

    <!-- FLOATING DIGITAL GLASS CONTROLS -->
    <div id="floating-controls" class="glass-panel" role="toolbar" aria-label="Player Controls">
        <button class="remote-btn remote-focusable" id="rm-prev" tabindex="0" aria-label="Previous Channel">◀ Prev</button>
        <button class="remote-btn remote-focusable" id="rm-next" tabindex="0" aria-label="Next Channel">▶ Next</button>
        <button class="remote-btn remote-focusable" id="rm-list" tabindex="0" aria-label="Channel List">☰ Channels</button>
        <button class="remote-btn remote-focusable" id="rm-vol" tabindex="0" aria-label="Volume Control">🔊 Vol</button>
        <button class="remote-btn remote-focusable" id="rm-bright" tabindex="0" aria-label="Brightness Control">☀ Bright</button>
        <button class="remote-btn remote-focusable" id="rm-aspect" tabindex="0" aria-label="Aspect Ratio">📺 Fit</button>
        <button class="remote-btn remote-focusable" id="rm-fullscreen" tabindex="0" aria-label="Toggle Fullscreen">⛶ Full</button>
        <button class="remote-btn remote-focusable" id="rm-close" tabindex="0" aria-label="Close Controls">✕ Close</button>
    </div>

    <!-- VOLUME SLIDER WIDGET -->
    <div class="slider-widget glass-panel" id="volume-widget">
        <span>🔊</span>
        <input type="range" id="vol-slider" class="remote-focusable" min="0" max="100" value="100" tabindex="0" aria-label="Volume Slider">
        <span id="vol-val">100%</span>
    </div>

    <!-- BRIGHTNESS SLIDER WIDGET -->
    <div class="slider-widget glass-panel" id="brightness-widget">
        <span>☀️</span>
        <input type="range" id="bright-slider" class="remote-focusable" min="20" max="100" value="100" tabindex="0" aria-label="Brightness Slider">
        <span id="bright-val">100%</span>
    </div>

    <!-- PLAYLIST MODAL -->
    <div id="playlist-modal" role="dialog" aria-label="Playlist Manager">
        <div class="modal-content glass-panel">
            <h3>Manage Playlists</h3>
            <div class="playlist-select-list" id="modal-playlist-list"></div>
            
            <div class="input-group">
                <label for="pl-name-input">Playlist Name</label>
                <input type="text" id="pl-name-input" class="remote-focusable" placeholder="e.g. World Sports TV" tabindex="0">
            </div>
            
            <div class="input-group">
                <label for="pl-url-input">Add M3U URL</label>
                <input type="text" id="pl-url-input" class="remote-focusable" placeholder="https://example.com/playlist.m3u" tabindex="0">
            </div>

            <div class="input-group">
                <label for="pl-file-input">Or Import M3U File</label>
                <div class="file-input-wrapper">
                    <button type="button" class="btn btn-secondary remote-focusable" id="btn-file-trigger" tabindex="0" style="width:100%; text-align:left;">📁 Choose Local File...</button>
                    <input type="file" id="pl-file-input" accept=".m3u,.m3u8" tabindex="-1">
                </div>
            </div>

            <div id="modal-status"></div>

            <div class="modal-actions">
                <button class="btn btn-secondary remote-focusable" id="btn-modal-close" tabindex="0">Cancel</button>
                <button class="btn btn-primary remote-focusable" id="btn-modal-save" tabindex="0">Save & Play</button>
            </div>
        </div>
    </div>

    <!-- EXIT CONFIRMATION MODAL -->
    <div id="exit-modal" role="dialog" aria-label="Exit Confirmation">
        <div class="modal-content glass-panel" style="text-align: center;">
            <h3 style="margin-bottom: 12px;">Exit IPTV Player?</h3>
            <p style="opacity: 0.8; margin-bottom: 20px; font-size: 0.95rem;">Are you sure you want to close the application?</p>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn btn-secondary remote-focusable" id="btn-exit-no" tabindex="0">NO</button>
                <button class="btn btn-danger remote-focusable" id="btn-exit-yes" tabindex="0">YES</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        /* ==========================================
           STATE & CONSTANTS
           ========================================== */
        const STORAGE_KEYS = {
            PLAYLISTS: 'iptv_playlists',
            SELECTED_PL: 'iptv_selected_pl',
            LAST_CHANNEL: 'iptv_last_channel',
            VOLUME: 'iptv_volume',
            BRIGHTNESS: 'iptv_brightness',
            ASPECT_RATIO: 'iptv_aspect_ratio'
        };

        const ASPECT_RATIOS = ['fit', 'fill', 'stretch', 'cover'];

        let state = {
            playlists: {},
            currentPlaylistKey: '',
            channels: [],
            currentIndex: -1,
            volume: 100,
            brightness: 100,
            aspectRatioIndex: 0,
            panelOpen: false,
            controlsVisible: false,
            modalOpen: false,
            exitModalOpen: false,
            activeWidget: null, // 'vol' or 'bright'
            osdTimer: null,
            interactionTimer: null,
            hideControlsTimer: null,
            touchStartY: 0,
            lastTapTime: 0,
            lastFocusedElement: null
        };

        /* Hierarchical UI Navigation Stack */
        const UI_LAYERS = {
            EXIT_MODAL: 'EXIT_MODAL',
            PLAYLIST_MODAL: 'PLAYLIST_MODAL',
            CHANNEL_PANEL: 'CHANNEL_PANEL',
            FLOATING_CONTROLS: 'FLOATING_CONTROLS'
        };
        let uiStack = [];

        let hls = null;

        /* DOM Elements */
        const video = document.getElementById('video');
        const brightnessOverlay = document.getElementById('brightness-overlay');
        const osd = document.getElementById('osd');
        const osdNumber = document.getElementById('osd-number');
        const osdLogo = document.getElementById('osd-logo');
        const osdName = document.getElementById('osd-name');
        const sidePanel = document.getElementById('side-panel');
        const channelContainer = document.getElementById('channel-list-container');
        const channelSpacer = document.getElementById('channel-list-spacer');
        const playlistModal = document.getElementById('playlist-modal');
        const exitModal = document.getElementById('exit-modal');
        const floatingControls = document.getElementById('floating-controls');

        const volSlider = document.getElementById('vol-slider');
        const volVal = document.getElementById('vol-val');
        const volWidget = document.getElementById('volume-widget');

        const brightSlider = document.getElementById('bright-slider');
        const brightVal = document.getElementById('bright-val');
        const brightWidget = document.getElementById('brightness-widget');

        const DEFAULT_PLAYLIST_NAME = "Free World TV";
        const DEFAULT_PLAYLIST_URL = "https://iptv-org.github.io/iptv/index.m3u";

        /* ==========================================
           INITIALIZATION & LOCALSTORAGE
           ========================================== */
        window.addEventListener('DOMContentLoaded', () => {
            loadSettingsFromStorage();
            initHLS();
            initEventListeners();
            requestFullscreenAndLandscape();
            
            // Auto-load or fetch default playlist
            if (Object.keys(state.playlists).length === 0) {
                fetchAndParseM3U(DEFAULT_PLAYLIST_URL, DEFAULT_PLAYLIST_NAME, true);
            } else {
                loadCurrentPlaylist();
            }

            // Initially present controls briefly
            showFloatingControls();
        });

        function requestFullscreenAndLandscape() {
            const reqFs = document.documentElement.requestFullscreen || 
                          document.documentElement.webkitRequestFullscreen || 
                          document.documentElement.mozRequestFullScreen || 
                          document.documentElement.msRequestFullscreen;

            if (reqFs && !document.fullscreenElement) {
                reqFs.call(document.documentElement).then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                }).catch(() => {});
            }

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            const unpairUnmute = () => {
                video.muted = false;
                video.play().catch(() => {});
                document.removeEventListener('keydown', unpairUnmute);
                document.removeEventListener('click', unpairUnmute);
            };
            document.addEventListener('keydown', unpairUnmute, { once: true });
            document.addEventListener('click', unpairUnmute, { once: true });
        }

        function loadSettingsFromStorage() {
            try {
                state.playlists = JSON.parse(localStorage.getItem(STORAGE_KEYS.PLAYLISTS) || '{}');
            } catch(e) {
                state.playlists = {};
            }
            state.currentPlaylistKey = localStorage.getItem(STORAGE_KEYS.SELECTED_PL) || '';
            state.currentIndex = parseInt(localStorage.getItem(STORAGE_KEYS.LAST_CHANNEL) || '0', 10);
            state.volume = parseInt(localStorage.getItem(STORAGE_KEYS.VOLUME) || '100', 10);
            state.brightness = parseInt(localStorage.getItem(STORAGE_KEYS.BRIGHTNESS) || '100', 10);
            state.aspectRatioIndex = parseInt(localStorage.getItem(STORAGE_KEYS.ASPECT_RATIO) || '0', 10);

            applyVolume(state.volume, false);
            applyBrightness(state.brightness, false);
            applyAspectRatio();
        }

        /* ==========================================
           UI STACK & HISTORY MANAGEMENT
           ========================================== */
        function pushUIState(layer) {
            uiStack = uiStack.filter(l => l !== layer);
            uiStack.push(layer);
            syncHistoryState();
        }

        function removeUIState(layer) {
            uiStack = uiStack.filter(l => l !== layer);
            syncHistoryState();
        }

        function syncHistoryState() {
            history.pushState({ stackLen: uiStack.length }, null, window.location.href);
        }

        /* ==========================================
           AUTO-HIDE & USER INTERACTION TIMERS
           ========================================== */
        function showFloatingControls(focusTarget = null) {
            floatingControls.classList.add('show');
            state.controlsVisible = true;
            pushUIState(UI_LAYERS.FLOATING_CONTROLS);
            resetAutoHideControlsTimer();
            if (focusTarget) {
                focusTarget.focus();
            } else if (!document.activeElement || document.activeElement === document.body || !floatingControls.contains(document.activeElement)) {
                document.getElementById('rm-list').focus();
            }
        }

        function hideFloatingControls() {
            floatingControls.classList.remove('show');
            volWidget.classList.remove('show');
            brightWidget.classList.remove('show');
            state.controlsVisible = false;
            state.activeWidget = null;
            clearTimeout(state.hideControlsTimer);
            removeUIState(UI_LAYERS.FLOATING_CONTROLS);
        }

        function resetAutoHideControlsTimer() {
            clearTimeout(state.hideControlsTimer);
            state.hideControlsTimer = setTimeout(() => {
                if (!state.panelOpen && !state.modalOpen && !state.exitModalOpen) {
                    hideFloatingControls();
                }
            }, 4000); // Auto-hide controls after 4s of inactivity
        }

        function registerActivity() {
            triggerVibration(10);
            if (state.controlsVisible) {
                resetAutoHideControlsTimer();
            }
            if (state.panelOpen) {
                resetInteractionTimer();
            }
        }

        function triggerVibration(pattern) {
            if (navigator.vibrate) {
                try { navigator.vibrate(pattern); } catch(e) {}
            }
        }

        /* ==========================================
           HLS & VIDEO PLAYER LOGIC
           ========================================== */
        function initHLS() {
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    manifestLoadingTimeOut: 10000,
                    manifestLoadingMaxRetry: 3
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                initHLS();
                                break;
                        }
                    }
                });
            }
        }

        function playChannel(index) {
            if (!state.channels || state.channels.length === 0) return;
            
            // Circular boundary switching
            if (index < 0) index = state.channels.length - 1;
            if (index >= state.channels.length) index = 0;

            state.currentIndex = index;
            localStorage.setItem(STORAGE_KEYS.LAST_CHANNEL, index);

            const channel = state.channels[index];
            showOSD(index + 1, channel.name, channel.logo);

            if (Hls.isSupported() && channel.url.includes('.m3u8')) {
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl') || channel.url) {
                video.src = channel.url;
                video.play().catch(() => {});
            }

            renderVirtualList();
            registerActivity();
        }

        /* ==========================================
           M3U PARSING & MANAGEMENT
           ========================================== */
        async function fetchAndParseM3U(url, name, setAsCurrent = false) {
            showModalStatus("loading", "<span class='spinner'></span> Loading playlist URL...");
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("HTTP error " + res.status);
                const text = await res.text();
                parseAndSaveM3U(text, name, url, setAsCurrent);
                showModalStatus("success", "✓ Playlist loaded successfully!");
                setTimeout(() => { if (state.modalOpen) closeModal(); }, 1200);
            } catch (err) {
                showModalStatus("error", "Failed to load M3U URL. Check CORS or link.");
            }
        }

        function parseAndSaveM3U(content, name, url = '', setAsCurrent = false) {
            const lines = content.split('\n');
            const channels = [];
            let currentCh = { name: '', logo: '', url: '' };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentCh.logo = logoMatch ? logoMatch[1] : '';

                    const parts = line.split(',');
                    currentCh.name = parts[parts.length - 1].trim() || "Unknown Channel";
                } else if (line && !line.startsWith('#')) {
                    currentCh.url = line;
                    channels.push({ ...currentCh });
                    currentCh = { name: '', logo: '', url: '' };
                }
            }

            if (channels.length > 0) {
                state.playlists[name] = { url, channels };
                localStorage.setItem(STORAGE_KEYS.PLAYLISTS, JSON.stringify(state.playlists));

                if (setAsCurrent || !state.currentPlaylistKey) {
                    state.currentPlaylistKey = name;
                    localStorage.setItem(STORAGE_KEYS.SELECTED_PL, name);
                    loadCurrentPlaylist();
                }
            } else {
                showModalStatus("error", "No valid channels found in file.");
            }
        }

        function loadCurrentPlaylist() {
            const pl = state.playlists[state.currentPlaylistKey];
            if (pl && pl.channels) {
                state.channels = pl.channels;
                if (state.currentIndex >= state.channels.length || state.currentIndex < 0) state.currentIndex = 0;
                playChannel(state.currentIndex);
                renderVirtualList();
            }
        }

        function showModalStatus(type, message) {
            const statusEl = document.getElementById('modal-status');
            statusEl.className = type;
            statusEl.innerHTML = message;
        }

        /* ==========================================
           VIRTUALIZED LIST FOR PERFORMANCE
           ========================================== */
        const ITEM_HEIGHT = 60;

        function renderVirtualList() {
            if (!state.panelOpen) return;

            const total = state.channels.length;
            channelSpacer.style.height = `${total * ITEM_HEIGHT}px`;

            const scrollTop = channelContainer.scrollTop;
            const viewportHeight = channelContainer.clientHeight;

            const startIndex = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - 2);
            const endIndex = Math.min(total, Math.ceil((scrollTop + viewportHeight) / ITEM_HEIGHT) + 2);

            const existingItems = channelSpacer.querySelectorAll('.channel-item');
            existingItems.forEach(item => item.remove());

            for (let i = startIndex; i < endIndex; i++) {
                const ch = state.channels[i];
                const item = document.createElement('div');
                item.className = `channel-item remote-focusable ${i === state.currentIndex ? 'active' : ''}`;
                item.style.top = `${i * ITEM_HEIGHT}px`;
                item.tabIndex = 0;
                item.dataset.index = i;
                item.setAttribute('role', 'option');
                item.setAttribute('aria-selected', i === state.currentIndex ? 'true' : 'false');

                item.innerHTML = `
                    <div class="ch-num">${i + 1}</div>
                    ${ch.logo ? `<img class="ch-logo" src="${ch.logo}" onerror="this.style.display='none'">` : ''}
                    <div class="ch-name">${ch.name}</div>
                `;

                item.addEventListener('click', () => {
                    playChannel(i);
                    closePanel();
                });

                channelSpacer.appendChild(item);
            }
        }

        function scrollChannelIntoView(index) {
            if (index < 0 || index >= state.channels.length) return;
            const itemTop = index * ITEM_HEIGHT;
            const itemBottom = itemTop + ITEM_HEIGHT;
            const containerTop = channelContainer.scrollTop;
            const containerBottom = containerTop + channelContainer.clientHeight;

            if (itemTop < containerTop) {
                channelContainer.scrollTop = itemTop;
            } else if (itemBottom > containerBottom) {
                channelContainer.scrollTop = itemBottom - channelContainer.clientHeight;
            }
            renderVirtualList();
            setTimeout(() => {
                const el = channelSpacer.querySelector(`.channel-item[data-index="${index}"]`);
                if (el) el.focus();
            }, 30);
        }

        channelContainer.addEventListener('scroll', renderVirtualList);

        /* ==========================================
           UI CONTROL & OSD
           ========================================== */
        function showOSD(num, name, logo) {
            osdNumber.textContent = String(num).padStart(2, '0');
            osdName.textContent = name;
            
            if (logo) {
                osdLogo.src = logo;
                osdLogo.style.display = 'block';
            } else {
                osdLogo.style.display = 'none';
            }

            osd.classList.add('show');
            clearTimeout(state.osdTimer);
            state.osdTimer = setTimeout(() => osd.classList.remove('show'), 3000);
        }

        function openPanel() {
            state.lastFocusedElement = document.activeElement;
            sidePanel.classList.add('open');
            state.panelOpen = true;
            pushUIState(UI_LAYERS.CHANNEL_PANEL);
            renderVirtualList();
            resetInteractionTimer();
            scrollChannelIntoView(state.currentIndex >= 0 ? state.currentIndex : 0);
        }

        function closePanel() {
            sidePanel.classList.remove('open');
            state.panelOpen = false;
            removeUIState(UI_LAYERS.CHANNEL_PANEL);
            clearTimeout(state.interactionTimer);
            if (state.lastFocusedElement && document.body.contains(state.lastFocusedElement)) {
                state.lastFocusedElement.focus();
            } else if (state.controlsVisible) {
                document.getElementById('rm-list').focus();
            }
        }

        function resetInteractionTimer() {
            clearTimeout(state.interactionTimer);
            if (state.panelOpen) {
                state.interactionTimer = setTimeout(() => {
                    closePanel();
                }, 8000);
            }
        }

        /* ==========================================
           VOLUME, BRIGHTNESS, ASPECT RATIO
           ========================================== */
        function applyVolume(val, showUI = true) {
            state.volume = Math.max(0, Math.min(100, val));
            video.volume = state.volume / 100;
            volSlider.value = state.volume;
            volVal.textContent = `${state.volume}%`;
            localStorage.setItem(STORAGE_KEYS.VOLUME, state.volume);
            if (showUI) showWidget('vol');
        }

        function applyBrightness(val, showUI = true) {
            state.brightness = Math.max(20, Math.min(100, val));
            const opacity = 1 - (state.brightness / 100);
            brightnessOverlay.style.opacity = opacity;
            brightSlider.value = state.brightness;
            brightVal.textContent = `${state.brightness}%`;
            localStorage.setItem(STORAGE_KEYS.BRIGHTNESS, state.brightness);
            if (showUI) showWidget('bright');
        }

        function applyAspectRatio() {
            const mode = ASPECT_RATIOS[state.aspectRatioIndex];
            video.className = `ar-${mode}`;
            document.getElementById('rm-aspect').textContent = `📺 ${mode.toUpperCase()}`;
            localStorage.setItem(STORAGE_KEYS.ASPECT_RATIO, state.aspectRatioIndex);
        }

        function cycleAspectRatio() {
            state.aspectRatioIndex = (state.aspectRatioIndex + 1) % ASPECT_RATIOS.length;
            applyAspectRatio();
            registerActivity();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
            registerActivity();
        }

        function showWidget(type) {
            state.activeWidget = type;
            if (type === 'vol') {
                brightWidget.classList.remove('show');
                volWidget.classList.add('show');
                showFloatingControls(volSlider);
            } else if (type === 'bright') {
                volWidget.classList.remove('show');
                brightWidget.classList.add('show');
                showFloatingControls(brightSlider);
            }
        }

        /* ==========================================
           SPATIAL NAVIGATION & TV REMOTE ENGINE
           ========================================== */
        const KEY_CODES = {
            ENTER: [13, 23, 66],
            BACK: [4, 27, 10009, 461],
            UP: [38],
            DOWN: [40],
            LEFT: [37],
            RIGHT: [39],
            MENU: [18, 93, 82],
            CHANNEL_UP: [33, 427],
            CHANNEL_DOWN: [34, 428],
            MEDIA_PLAY_PAUSE: [179, 10252],
            MEDIA_STOP: [178]
        };

        function isKey(e, codeArray) {
            return codeArray.includes(e.keyCode) || codeArray.includes(e.which);
        }

        function getScopedFocusables() {
            let container = document.body;
            if (state.exitModalOpen) {
                container = exitModal;
            } else if (state.modalOpen) {
                container = playlistModal;
            } else if (state.panelOpen) {
                container = sidePanel;
            } else if (state.controlsVisible) {
                container = document.body;
            }
            return Array.from(container.querySelectorAll('.remote-focusable, input[tabindex="0"], button[tabindex="0"]'))
                .filter(el => {
                    const rect = el.getBoundingClientRect();
                    return rect.width > 0 && rect.height > 0 && 
                           getComputedStyle(el).visibility !== 'hidden' && 
                           getComputedStyle(el).display !== 'none';
                });
        }

        function handleSpatialNavigation(direction) {
            const focusables = getScopedFocusables();
            const current = document.activeElement;

            if (!current || !focusables.includes(current)) {
                if (focusables.length > 0) focusables[0].focus();
                return;
            }

            const currentRect = current.getBoundingClientRect();
            const currentCenter = {
                x: currentRect.left + currentRect.width / 2,
                y: currentRect.top + currentRect.height / 2
            };

            let bestCandidate = null;
            let minDistance = Infinity;

            focusables.forEach(candidate => {
                if (candidate === current) return;
                const candRect = candidate.getBoundingClientRect();
                const candCenter = {
                    x: candRect.left + candRect.width / 2,
                    y: candRect.top + candRect.height / 2
                };

                const dx = candCenter.x - currentCenter.x;
                const dy = candCenter.y - currentCenter.y;

                let isValid = false;
                if (direction === 'LEFT' && dx < -5 && Math.abs(dy) <= Math.abs(dx) * 1.5) isValid = true;
                if (direction === 'RIGHT' && dx > 5 && Math.abs(dy) <= Math.abs(dx) * 1.5) isValid = true;
                if (direction === 'UP' && dy < -5 && Math.abs(dx) <= Math.abs(dy) * 1.5) isValid = true;
                if (direction === 'DOWN' && dy > 5 && Math.abs(dx) <= Math.abs(dy) * 1.5) isValid = true;

                if (isValid) {
                    const distance = Math.hypot(dx, dy);
                    if (distance < minDistance) {
                        minDistance = distance;
                        bestCandidate = candidate;
                    }
                }
            });

            if (bestCandidate) {
                bestCandidate.focus();
            }
        }

        /* ==========================================
           BACK BUTTON HIERARCHICAL DISPATCHER
           ========================================== */
        function handleBackNavigation() {
            // Dismiss active layer strictly from topmost priority down
            if (state.exitModalOpen) {
                closeExitModal();
                return;
            }
            if (state.modalOpen) {
                closeModal();
                return;
            }
            if (state.panelOpen) {
                closePanel();
                return;
            }
            if (state.controlsVisible) {
                hideFloatingControls();
                return;
            }

            // When no UI layer is active, prompt explicit exit confirmation without dropping fullscreen
            openExitModal();
        }

        function openExitModal() {
            exitModal.classList.add('open');
            state.exitModalOpen = true;
            pushUIState(UI_LAYERS.EXIT_MODAL);
            setTimeout(() => {
                const btnNo = document.getElementById('btn-exit-no');
                if (btnNo) btnNo.focus();
            }, 50);
        }

        function closeExitModal() {
            exitModal.classList.remove('open');
            state.exitModalOpen = false;
            removeUIState(UI_LAYERS.EXIT_MODAL);
            if (state.controlsVisible) {
                document.getElementById('rm-list').focus();
            }
        }

        /* ==========================================
           EVENT LISTENERS & TOUCH GESTURES
           ========================================== */
        function initEventListeners() {
            window.addEventListener('mousemove', registerActivity);

            // Comprehensive Universal Smart TV Remote & Keyboard Event Engine
            document.addEventListener('keydown', (e) => {
                registerActivity();

                // 1. Channel Up / Down Keys
                if (isKey(e, KEY_CODES.CHANNEL_UP)) {
                    e.preventDefault();
                    playChannel(state.currentIndex - 1);
                    return;
                }
                if (isKey(e, KEY_CODES.CHANNEL_DOWN)) {
                    e.preventDefault();
                    playChannel(state.currentIndex + 1);
                    return;
                }

                // 2. Menu Key
                if (isKey(e, KEY_CODES.MENU)) {
                    e.preventDefault();
                    if (!state.controlsVisible) showFloatingControls();
                    else hideFloatingControls();
                    return;
                }

                // 3. Media Play / Pause Keys
                if (isKey(e, KEY_CODES.MEDIA_PLAY_PAUSE)) {
                    e.preventDefault();
                    if (video.paused) video.play();
                    else video.pause();
                    return;
                }

                // 4. Back Key Priority Stack Engine
                if (isKey(e, KEY_CODES.BACK)) {
                    e.preventDefault();
                    e.stopPropagation();
                    handleBackNavigation();
                    return;
                }

                // 5. Active Exit Modal Navigation
                if (state.exitModalOpen) {
                    if (isKey(e, KEY_CODES.LEFT) || isKey(e, KEY_CODES.RIGHT)) {
                        e.preventDefault();
                        handleSpatialNavigation(isKey(e, KEY_CODES.LEFT) ? 'LEFT' : 'RIGHT');
                        return;
                    }
                    if (isKey(e, KEY_CODES.ENTER)) {
                        e.preventDefault();
                        if (document.activeElement) document.activeElement.click();
                        return;
                    }
                }

                // 6. Active Panel Specific Navigation
                if (state.panelOpen) {
                    const active = document.activeElement;
                    const headerBtns = Array.from(sidePanel.querySelectorAll('.panel-header .remote-focusable'));
                    const isHeaderFocused = headerBtns.includes(active);
                    const isChannelItemFocused = active && active.classList.contains('channel-item');

                    if (isKey(e, KEY_CODES.UP)) {
                        e.preventDefault();
                        if (isChannelItemFocused) {
                            const idx = parseInt(active.dataset.index, 10);
                            if (idx === 0) {
                                document.getElementById('btn-playlists-modal').focus();
                            } else {
                                const prevIdx = idx - 1;
                                state.currentIndex = prevIdx;
                                scrollChannelIntoView(prevIdx);
                            }
                        } else if (!isHeaderFocused) {
                            scrollChannelIntoView(0);
                        }
                        return;
                    }

                    if (isKey(e, KEY_CODES.DOWN)) {
                        e.preventDefault();
                        if (isHeaderFocused) {
                            const targetIdx = state.currentIndex >= 0 ? state.currentIndex : 0;
                            scrollChannelIntoView(targetIdx);
                        } else if (isChannelItemFocused) {
                            const idx = parseInt(active.dataset.index, 10);
                            const nextIdx = idx + 1;
                            if (nextIdx < state.channels.length) {
                                state.currentIndex = nextIdx;
                                scrollChannelIntoView(nextIdx);
                            }
                        }
                        return;
                    }

                    if (isKey(e, KEY_CODES.LEFT) || isKey(e, KEY_CODES.RIGHT)) {
                        if (isHeaderFocused) {
                            e.preventDefault();
                            handleSpatialNavigation(isKey(e, KEY_CODES.LEFT) ? 'LEFT' : 'RIGHT');
                            return;
                        }
                    }

                    if (isKey(e, KEY_CODES.ENTER)) {
                        e.preventDefault();
                        if (isChannelItemFocused) {
                            const idx = parseInt(active.dataset.index, 10);
                            playChannel(idx);
                            closePanel();
                        } else if (active) {
                            active.click();
                        }
                        return;
                    }

                    if (isKey(e, KEY_CODES.RIGHT) && !isHeaderFocused) {
                        e.preventDefault();
                        closePanel();
                        return;
                    }
                }

                // 7. Modal Specific Navigation
                if (state.modalOpen) {
                    if (isKey(e, KEY_CODES.UP)) { e.preventDefault(); handleSpatialNavigation('UP'); return; }
                    if (isKey(e, KEY_CODES.DOWN)) { e.preventDefault(); handleSpatialNavigation('DOWN'); return; }
                    if (isKey(e, KEY_CODES.LEFT)) { e.preventDefault(); handleSpatialNavigation('LEFT'); return; }
                    if (isKey(e, KEY_CODES.RIGHT)) { e.preventDefault(); handleSpatialNavigation('RIGHT'); return; }
                    if (isKey(e, KEY_CODES.ENTER)) {
                        e.preventDefault();
                        if (document.activeElement) document.activeElement.click();
                        return;
                    }
                }

                // 8. Slider Focus Control Navigation
                if (state.controlsVisible && (document.activeElement === volSlider || document.activeElement === brightSlider)) {
                    if (isKey(e, KEY_CODES.LEFT)) {
                        e.preventDefault();
                        if (document.activeElement === volSlider) applyVolume(state.volume - 5);
                        else applyBrightness(state.brightness - 5);
                        return;
                    }
                    if (isKey(e, KEY_CODES.RIGHT)) {
                        e.preventDefault();
                        if (document.activeElement === volSlider) applyVolume(state.volume + 5);
                        else applyBrightness(state.brightness + 5);
                        return;
                    }
                    if (isKey(e, KEY_CODES.DOWN) || isKey(e, KEY_CODES.UP)) {
                        e.preventDefault();
                        document.getElementById(document.activeElement === volSlider ? 'rm-vol' : 'rm-bright').focus();
                        return;
                    }
                }

                // 9. Floating Nav Toolbar Controls & Default Directional Keys
                if (isKey(e, KEY_CODES.ENTER)) {
                    if (!state.controlsVisible && !state.panelOpen && !state.modalOpen && !state.exitModalOpen) {
                        e.preventDefault();
                        showFloatingControls();
                    } else if (document.activeElement && document.activeElement !== document.body) {
                        e.preventDefault();
                        document.activeElement.click();
                    }
                    return;
                }

                if (isKey(e, KEY_CODES.LEFT)) {
                    e.preventDefault();
                    if (!state.controlsVisible) openPanel();
                    else handleSpatialNavigation('LEFT');
                    return;
                }
                if (isKey(e, KEY_CODES.RIGHT)) {
                    e.preventDefault();
                    if (state.controlsVisible) handleSpatialNavigation('RIGHT');
                    return;
                }
                if (isKey(e, KEY_CODES.UP)) {
                    e.preventDefault();
                    if (!state.controlsVisible) playChannel(state.currentIndex - 1);
                    else handleSpatialNavigation('UP');
                    return;
                }
                if (isKey(e, KEY_CODES.DOWN)) {
                    e.preventDefault();
                    if (!state.controlsVisible) playChannel(state.currentIndex + 1);
                    else handleSpatialNavigation('DOWN');
                    return;
                }
            });

            // Touch Gestures for Mobile (Swipe UP/DOWN, Single Tap, Double Tap)
            document.addEventListener('touchstart', (e) => {
                state.touchStartY = e.touches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                const diffY = state.touchStartY - touchEndY;

                // Swipe Detection
                if (Math.abs(diffY) > 50 && !state.panelOpen && !state.modalOpen && !state.exitModalOpen) {
                    if (diffY > 0) {
                        playChannel(state.currentIndex + 1); // Swipe Up -> Next Channel
                    } else {
                        playChannel(state.currentIndex - 1); // Swipe Down -> Prev Channel
                    }
                    return;
                }

                // Single / Double Tap Controls Toggle
                const currentTime = new Date().getTime();
                const tapLength = currentTime - state.lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    if (state.controlsVisible) {
                        hideFloatingControls();
                    } else {
                        showFloatingControls();
                    }
                    e.preventDefault();
                } else {
                    if (!state.controlsVisible) {
                        showFloatingControls();
                    } else {
                        registerActivity();
                    }
                }
                state.lastTapTime = currentTime;
            });

            // On-Screen Remote Buttons
            document.getElementById('rm-prev').addEventListener('click', () => playChannel(state.currentIndex - 1));
            document.getElementById('rm-next').addEventListener('click', () => playChannel(state.currentIndex + 1));
            document.getElementById('rm-list').addEventListener('click', () => openPanel());
            document.getElementById('rm-vol').addEventListener('click', () => showWidget('vol'));
            document.getElementById('rm-bright').addEventListener('click', () => showWidget('bright'));
            document.getElementById('rm-aspect').addEventListener('click', cycleAspectRatio);
            document.getElementById('rm-fullscreen').addEventListener('click', toggleFullscreen);
            document.getElementById('rm-close').addEventListener('click', hideFloatingControls);

            document.getElementById('btn-close-panel').addEventListener('click', closePanel);

            // Sliders
            volSlider.addEventListener('input', (e) => applyVolume(parseInt(e.target.value, 10)));
            brightSlider.addEventListener('input', (e) => applyBrightness(parseInt(e.target.value, 10)));

            // File Trigger & Input Handling
            const fileTrigger = document.getElementById('btn-file-trigger');
            const fileInput = document.getElementById('pl-file-input');
            fileTrigger.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    fileTrigger.textContent = `📁 ${fileInput.files[0].name}`;
                }
            });

            // Modal Triggers
            document.getElementById('btn-playlists-modal').addEventListener('click', openModal);
            document.getElementById('btn-modal-close').addEventListener('click', closeModal);
            document.getElementById('btn-modal-save').addEventListener('click', handleModalSave);

            // Exit Modal Triggers
            document.getElementById('btn-exit-no').addEventListener('click', closeExitModal);
            document.getElementById('btn-exit-yes').addEventListener('click', () => {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
                window.history.go(-(window.history.length));
            });

            // Browser Back Button & History API Engine
            window.addEventListener('popstate', () => {
                handleBackNavigation();
            });
            syncHistoryState();
        }

        /* ==========================================
           PLAYLIST MODAL MANAGEMENT
           ========================================== */
        function openModal() {
            state.lastFocusedElement = document.activeElement;
            renderModalPlaylists();
            playlistModal.classList.add('open');
            state.modalOpen = true;
            pushUIState(UI_LAYERS.PLAYLIST_MODAL);
            const statusEl = document.getElementById('modal-status');
            statusEl.className = '';
            statusEl.style.display = 'none';

            setTimeout(() => {
                const firstInput = document.getElementById('pl-name-input');
                if (firstInput) firstInput.focus();
            }, 50);
        }

        function closeModal() {
            playlistModal.classList.remove('open');
            state.modalOpen = false;
            removeUIState(UI_LAYERS.PLAYLIST_MODAL);
            if (state.panelOpen) {
                document.getElementById('btn-playlists-modal').focus();
            } else if (state.controlsVisible) {
                document.getElementById('rm-list').focus();
            }
        }

        function renderModalPlaylists() {
            const container = document.getElementById('modal-playlist-list');
            container.innerHTML = '';

            const keys = Object.keys(state.playlists);
            if (keys.length === 0) {
                container.innerHTML = '<div style="padding:12px; opacity:0.6; text-align:center; font-size:0.85rem;">No playlists saved.</div>';
                return;
            }

            keys.forEach((key) => {
                const item = document.createElement('div');
                item.className = 'playlist-option';
                item.innerHTML = `
                    <span style="font-size:0.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px;">
                        ${key === state.currentPlaylistKey ? '<b>' + key + ' (Active)</b>' : key}
                    </span>
                    <div style="display:flex; gap:6px;">
                        <button class="btn-icon remote-focusable btn-sw" tabindex="0">Switch</button>
                        <button class="btn-icon btn-danger remote-focusable btn-del" tabindex="0">✕</button>
                    </div>
                `;

                item.querySelector('.btn-sw').onclick = () => {
                    state.currentPlaylistKey = key;
                    localStorage.setItem(STORAGE_KEYS.SELECTED_PL, key);
                    loadCurrentPlaylist();
                    closeModal();
                    closePanel();
                };

                item.querySelector('.btn-del').onclick = (e) => {
                    e.stopPropagation();
                    delete state.playlists[key];
                    localStorage.setItem(STORAGE_KEYS.PLAYLISTS, JSON.stringify(state.playlists));
                    if (state.currentPlaylistKey === key) {
                        state.currentPlaylistKey = Object.keys(state.playlists)[0] || '';
                        localStorage.setItem(STORAGE_KEYS.SELECTED_PL, state.currentPlaylistKey);
                    }
                    renderModalPlaylists();
                };

                container.appendChild(item);
            });
        }

        function handleModalSave() {
            const name = document.getElementById('pl-name-input').value.trim() || `Playlist ${Date.now()}`;
            const url = document.getElementById('pl-url-input').value.trim();
            const fileInput = document.getElementById('pl-file-input');

            if (fileInput.files.length > 0) {
                showModalStatus("loading", "<span class='spinner'></span> Reading M3U File...");
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    parseAndSaveM3U(e.target.result, name, '', true);
                    showModalStatus("success", "✓ M3U File Imported Successfully!");
                    setTimeout(() => {
                        closeModal();
                        closePanel();
                    }, 1000);
                };
                reader.onerror = () => {
                    showModalStatus("error", "Error reading local M3U file.");
                };
                reader.readAsText(file);
            } else if (url) {
                fetchAndParseM3U(url, name, true);
            } else {
                showModalStatus("error", "Please enter a valid M3U URL or choose a file.");
            }
        }
    </script>
</body>
</html>
