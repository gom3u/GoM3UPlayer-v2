<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Pinch-zoom disabled for touch & mobile usability -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart IPTV Web Player</title>

    <!-- hls.js CDN for live stream support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* ==========================================
           RESET & ESSENTIAL LAYOUT STYLES
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        /* Visible Focus Outline for TV D-Pad & Keyboard Remote Navigation */
        :focus {
            outline: 3px solid #3b82f6 !important;
            outline-offset: 3px;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            font-family: inherit;
        }

        /* ==========================================
           FULLSCREEN VIDEO PLAYER & BRIGHTNESS
           ========================================== */
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Default Aspect Ratio */
        }

        /* Brightness Overlay Simulation */
        #brightness-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            opacity: 0; /* Managed via JS (0 to 0.8) */
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.2s linear;
        }

        /* Aspect Ratio Class Overrides */
        .ar-fit { object-fit: contain !important; }
        .ar-fill { object-fit: cover !important; }
        .ar-stretch { object-fit: fill !important; }
        .ar-cover { object-fit: scale-down !important; }

        /* ==========================================
           GLASSMORPHISM COMMON STYLES
           ========================================== */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* ==========================================
           ON-SCREEN DISPLAY (OSD)
           ========================================== */
        #osd {
            position: absolute;
            top: clamp(20px, 5vh, 40px);
            left: clamp(20px, 5vw, 40px);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 20;
            opacity: 0;
            transform: translate3d(0, -20px, 0) scale(0.96);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            max-width: calc(100vw - 80px);
            will-change: opacity, transform;
        }

        #osd.show {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }

        #osd-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #3b82f6;
            min-width: 40px;
            text-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        #osd-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #osd-name {
            font-size: 1.15rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
        }

        /* ==========================================
           SIDE PANEL (CHANNEL LIST)
           ========================================== */
        #side-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: min(380px, 85vw);
            height: 100%;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            transform: translate3d(-100%, 0, 0);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 12px 0 36px rgba(0, 0, 0, 0.6);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            will-change: transform;
        }

        #side-panel.open {
            transform: translate3d(0, 0, 0);
        }

        .panel-header {
            padding: 20px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        .btn-icon:hover, .btn-icon:focus {
            background: #3b82f6;
            border-color: #60a5fa;
            transform: translateY(-1px);
        }

        /* Virtualized Scroll Container */
        #channel-list-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }

        #channel-list-spacer {
            width: 100%;
            position: relative;
        }

        .channel-item {
            position: absolute;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s, transform 0.15s;
        }

        .channel-item:hover, .channel-item:focus {
            background: rgba(59, 130, 246, 0.3);
        }

        .channel-item.active {
            background: rgba(59, 130, 246, 0.85);
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .channel-item .ch-num {
            font-size: 0.9rem;
            font-weight: 700;
            opacity: 0.6;
            width: 35px;
        }

        .channel-item .ch-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-item .ch-name {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        /* ==========================================
           FLOATING GLASS NAVIGATION CONTROLS
           ========================================== */
        #floating-controls {
            position: absolute;
            bottom: clamp(16px, 4vh, 32px);
            left: 50%;
            transform: translate3d(-50%, 20px, 0) scale(0.96);
            padding: 8px 16px;
            border-radius: 32px;
            display: flex;
            gap: 8px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 95vw;
            overflow-x: auto;
            scrollbar-width: none;
            will-change: opacity, transform;
        }

        #floating-controls::-webkit-scrollbar { display: none; }

        #floating-controls.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate3d(-50%, 0, 0) scale(1);
        }

        .remote-btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: background 0.2s, transform 0.15s, border-color 0.2s;
        }

        .remote-btn:hover, .remote-btn:focus {
            background: #3b82f6;
            border-color: #60a5fa;
            transform: scale(1.04);
        }

        .remote-btn:active {
            transform: scale(0.96);
        }

        /* Floating Sliders (Volume & Brightness) */
        .slider-widget {
            position: absolute;
            bottom: clamp(75px, 12vh, 95px);
            left: 50%;
            transform: translate3d(-50%, 15px, 0) scale(0.95);
            padding: 12px 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .slider-widget.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate3d(-50%, 0, 0) scale(1);
        }

        .slider-widget input[type="range"] {
            width: 130px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .slider-widget span {
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 42px;
        }

        /* ==========================================
           PLAYLIST MANAGER GLASS MODAL
           ========================================== */
        #playlist-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #playlist-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%;
            max-width: 480px;
            padding: 28px;
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #playlist-modal.open .modal-content {
            transform: scale(1);
        }

        .modal-content h3 {
            margin-bottom: 18px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-group input[type="text"]:focus {
            border-color: #3b82f6;
        }

        .playlist-select-list {
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        .playlist-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-primary { background: #3b82f6; border-color: #60a5fa; }
        .btn-danger { background: #ef4444; border-color: #f87171; }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.12); }

        .btn:hover, .btn:focus {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        /* ==========================================
           RESPONSIVE ADJUSTMENTS
           ========================================== */
        @media (max-width: 600px) {
            #osd { top: 20px; left: 20px; font-size: 0.9rem; }
            .remote-btn { padding: 6px 12px; font-size: 0.78rem; }
        }
    </style>
</head>
<body>

    <!-- VIDEO CONTAINER -->
    <div id="video-container">
        <video id="video" playsinline autopip></video>
        <div id="brightness-overlay"></div>
    </div>

    <!-- OSD (ON SCREEN DISPLAY) -->
    <div id="osd" class="glass-panel">
        <div id="osd-number">01</div>
        <img id="osd-logo" src="" alt="" style="display:none;">
        <div id="osd-name">Channel Name</div>
    </div>

    <!-- SIDE PANEL (CHANNELS) -->
    <div id="side-panel">
        <div class="panel-header">
            <h2 id="panel-title">Channels</h2>
            <div class="panel-actions">
                <button class="btn-icon" id="btn-playlists-modal" tabindex="0">Playlists</button>
                <button class="btn-icon" id="btn-close-panel" tabindex="0">✕</button>
            </div>
        </div>
        <div id="channel-list-container" tabindex="0">
            <div id="channel-list-spacer"></div>
        </div>
    </div>

    <!-- FLOATING DIGITAL GLASS CONTROLS -->
    <div id="floating-controls" class="glass-panel">
        <button class="remote-btn" id="rm-prev" tabindex="0">◀ Prev</button>
        <button class="remote-btn" id="rm-next" tabindex="0">▶ Next</button>
        <button class="remote-btn" id="rm-list" tabindex="0">☰ Channels</button>
        <button class="remote-btn" id="rm-vol" tabindex="0">🔊 Vol</button>
        <button class="remote-btn" id="rm-bright" tabindex="0">☀ Bright</button>
        <button class="remote-btn" id="rm-aspect" tabindex="0">📺 Fit</button>
        <button class="remote-btn" id="rm-fullscreen" tabindex="0">⛶ Full</button>
        <button class="remote-btn" id="rm-close" tabindex="0">✕ Close</button>
    </div>

    <!-- VOLUME SLIDER WIDGET -->
    <div class="slider-widget glass-panel" id="volume-widget">
        <span>🔊</span>
        <input type="range" id="vol-slider" min="0" max="100" value="100" tabindex="0">
        <span id="vol-val">100%</span>
    </div>

    <!-- BRIGHTNESS SLIDER WIDGET -->
    <div class="slider-widget glass-panel" id="brightness-widget">
        <span>☀️</span>
        <input type="range" id="bright-slider" min="20" max="100" value="100" tabindex="0">
        <span id="bright-val">100%</span>
    </div>

    <!-- PLAYLIST MODAL -->
    <div id="playlist-modal">
        <div class="modal-content glass-panel">
            <h3>Manage Playlists</h3>
            <div class="playlist-select-list" id="modal-playlist-list"></div>
            
            <div class="input-group">
                <label>Playlist Name</label>
                <input type="text" id="pl-name-input" placeholder="e.g. World Sports TV" tabindex="0">
            </div>
            
            <div class="input-group">
                <label>Add M3U URL</label>
                <input type="text" id="pl-url-input" placeholder="https://example.com/playlist.m3u" tabindex="0">
            </div>

            <div class="input-group">
                <label>Or Import M3U File</label>
                <input type="file" id="pl-file-input" accept=".m3u,.m3u8" tabindex="0">
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-modal-close" tabindex="0">Cancel</button>
                <button class="btn btn-primary" id="btn-modal-save" tabindex="0">Save & Play</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        /* ==========================================
           STATE & CONSTANTS
           ========================================== */
        const STORAGE_KEYS = {
            PLAYLISTS: 'iptv_playlists',
            SELECTED_PL: 'iptv_selected_pl',
            LAST_CHANNEL: 'iptv_last_channel',
            VOLUME: 'iptv_volume',
            BRIGHTNESS: 'iptv_brightness',
            ASPECT_RATIO: 'iptv_aspect_ratio'
        };

        const ASPECT_RATIOS = ['fit', 'fill', 'stretch', 'cover'];

        let state = {
            playlists: {},
            currentPlaylistKey: '',
            channels: [],
            currentIndex: -1,
            volume: 100,
            brightness: 100,
            aspectRatioIndex: 0,
            panelOpen: false,
            controlsVisible: false,
            osdTimer: null,
            interactionTimer: null,
            hideControlsTimer: null,
            widgetTimer: null,
            touchStartY: 0,
            lastTapTime: 0
        };

        let hls = null;

        /* DOM Elements */
        const video = document.getElementById('video');
        const brightnessOverlay = document.getElementById('brightness-overlay');
        const osd = document.getElementById('osd');
        const osdNumber = document.getElementById('osd-number');
        const osdLogo = document.getElementById('osd-logo');
        const osdName = document.getElementById('osd-name');
        const sidePanel = document.getElementById('side-panel');
        const channelContainer = document.getElementById('channel-list-container');
        const channelSpacer = document.getElementById('channel-list-spacer');
        const playlistModal = document.getElementById('playlist-modal');
        const floatingControls = document.getElementById('floating-controls');

        const volSlider = document.getElementById('vol-slider');
        const volVal = document.getElementById('vol-val');
        const volWidget = document.getElementById('volume-widget');

        const brightSlider = document.getElementById('bright-slider');
        const brightVal = document.getElementById('bright-val');
        const brightWidget = document.getElementById('brightness-widget');

        const DEFAULT_PLAYLIST_NAME = "Free World TV";
        const DEFAULT_PLAYLIST_URL = "https://iptv-org.github.io/iptv/index.m3u";

        /* ==========================================
           INITIALIZATION & LOCALSTORAGE
           ========================================== */
        window.addEventListener('DOMContentLoaded', () => {
            loadSettingsFromStorage();
            initHLS();
            initEventListeners();
            
            // Auto-load or fetch default playlist
            if (Object.keys(state.playlists).length === 0) {
                fetchAndParseM3U(DEFAULT_PLAYLIST_URL, DEFAULT_PLAYLIST_NAME, true);
            } else {
                loadCurrentPlaylist();
            }

            // Initially present controls briefly
            showFloatingControls();
        });

        function loadSettingsFromStorage() {
            state.playlists = JSON.parse(localStorage.getItem(STORAGE_KEYS.PLAYLISTS) || '{}');
            state.currentPlaylistKey = localStorage.getItem(STORAGE_KEYS.SELECTED_PL) || '';
            state.currentIndex = parseInt(localStorage.getItem(STORAGE_KEYS.LAST_CHANNEL) || '0', 10);
            state.volume = parseInt(localStorage.getItem(STORAGE_KEYS.VOLUME) || '100', 10);
            state.brightness = parseInt(localStorage.getItem(STORAGE_KEYS.BRIGHTNESS) || '100', 10);
            state.aspectRatioIndex = parseInt(localStorage.getItem(STORAGE_KEYS.ASPECT_RATIO) || '0', 10);

            applyVolume(state.volume, false);
            applyBrightness(state.brightness, false);
            applyAspectRatio();
        }

        /* ==========================================
           AUTO-HIDE & USER INTERACTION TIMERS
           ========================================== */
        function showFloatingControls() {
            floatingControls.classList.add('show');
            state.controlsVisible = true;
            resetAutoHideControlsTimer();
        }

        function hideFloatingControls() {
            floatingControls.classList.remove('show');
            volWidget.classList.remove('show');
            brightWidget.classList.remove('show');
            state.controlsVisible = false;
            clearTimeout(state.hideControlsTimer);
        }

        function resetAutoHideControlsTimer() {
            clearTimeout(state.hideControlsTimer);
            state.hideControlsTimer = setTimeout(() => {
                hideFloatingControls();
            }, 4000); // Auto-hide controls after 4s of inactivity
        }

        function registerActivity() {
            if (state.controlsVisible) {
                resetAutoHideControlsTimer();
            }
            resetInteractionTimer();
        }

        /* ==========================================
           HLS & VIDEO PLAYER LOGIC
           ========================================== */
        function initHLS() {
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    manifestLoadingTimeOut: 10000,
                    manifestLoadingMaxRetry: 3
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                initHLS();
                                break;
                        }
                    }
                });
            }
        }

        function playChannel(index) {
            if (!state.channels || state.channels.length === 0) return;
            
            // Circular boundary switching
            if (index < 0) index = state.channels.length - 1;
            if (index >= state.channels.length) index = 0;

            state.currentIndex = index;
            localStorage.setItem(STORAGE_KEYS.LAST_CHANNEL, index);

            const channel = state.channels[index];
            showOSD(index + 1, channel.name, channel.logo);

            if (Hls.isSupported() && channel.url.includes('.m3u8')) {
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl') || channel.url) {
                video.src = channel.url;
                video.play().catch(() => {});
            }

            renderVirtualList();
            registerActivity();
        }

        /* ==========================================
           M3U PARSING & MANAGEMENT
           ========================================== */
        async function fetchAndParseM3U(url, name, setAsCurrent = false) {
            try {
                const res = await fetch(url);
                const text = await res.text();
                parseAndSaveM3U(text, name, url, setAsCurrent);
            } catch (err) {
                alert("Failed to load M3U URL. Please verify URL and CORS settings.");
            }
        }

        function parseAndSaveM3U(content, name, url = '', setAsCurrent = false) {
            const lines = content.split('\n');
            const channels = [];
            let currentCh = { name: '', logo: '', url: '' };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentCh.logo = logoMatch ? logoMatch[1] : '';

                    const parts = line.split(',');
                    currentCh.name = parts[parts.length - 1].trim() || "Unknown Channel";
                } else if (line && !line.startsWith('#')) {
                    currentCh.url = line;
                    channels.push({ ...currentCh });
                    currentCh = { name: '', logo: '', url: '' };
                }
            }

            if (channels.length > 0) {
                state.playlists[name] = { url, channels };
                localStorage.setItem(STORAGE_KEYS.PLAYLISTS, JSON.stringify(state.playlists));

                if (setAsCurrent || !state.currentPlaylistKey) {
                    state.currentPlaylistKey = name;
                    localStorage.setItem(STORAGE_KEYS.SELECTED_PL, name);
                    loadCurrentPlaylist();
                }
            } else {
                alert("No valid channels found in file.");
            }
        }

        function loadCurrentPlaylist() {
            const pl = state.playlists[state.currentPlaylistKey];
            if (pl && pl.channels) {
                state.channels = pl.channels;
                if (state.currentIndex >= state.channels.length) state.currentIndex = 0;
                playChannel(state.currentIndex);
                renderVirtualList();
            }
        }

        /* ==========================================
           VIRTUALIZED LIST FOR PERFORMANCE
           ========================================== */
        const ITEM_HEIGHT = 60;

        function renderVirtualList() {
            if (!state.panelOpen) return;

            const total = state.channels.length;
            channelSpacer.style.height = `${total * ITEM_HEIGHT}px`;

            const scrollTop = channelContainer.scrollTop;
            const viewportHeight = channelContainer.clientHeight;

            const startIndex = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - 2);
            const endIndex = Math.min(total, Math.ceil((scrollTop + viewportHeight) / ITEM_HEIGHT) + 2);

            const existingItems = channelSpacer.querySelectorAll('.channel-item');
            existingItems.forEach(item => item.remove());

            for (let i = startIndex; i < endIndex; i++) {
                const ch = state.channels[i];
                const item = document.createElement('div');
                item.className = `channel-item ${i === state.currentIndex ? 'active' : ''}`;
                item.style.top = `${i * ITEM_HEIGHT}px`;
                item.tabIndex = 0;

                item.innerHTML = `
                    <div class="ch-num">${i + 1}</div>
                    ${ch.logo ? `<img class="ch-logo" src="${ch.logo}" onerror="this.style.display='none'">` : ''}
                    <div class="ch-name">${ch.name}</div>
                `;

                item.addEventListener('click', () => {
                    playChannel(i);
                    closePanel();
                });

                channelSpacer.appendChild(item);
            }
        }

        channelContainer.addEventListener('scroll', renderVirtualList);

        /* ==========================================
           UI CONTROL & OSD
           ========================================== */
        function showOSD(num, name, logo) {
            osdNumber.textContent = String(num).padStart(2, '0');
            osdName.textContent = name;
            
            if (logo) {
                osdLogo.src = logo;
                osdLogo.style.display = 'block';
            } else {
                osdLogo.style.display = 'none';
            }

            osd.classList.add('show');
            clearTimeout(state.osdTimer);
            state.osdTimer = setTimeout(() => osd.classList.remove('show'), 3000);
        }

        function openPanel() {
            sidePanel.classList.add('open');
            state.panelOpen = true;
            renderVirtualList();
            resetInteractionTimer();
            channelContainer.focus();
        }

        function closePanel() {
            sidePanel.classList.remove('open');
            state.panelOpen = false;
            clearTimeout(state.interactionTimer);
        }

        function resetInteractionTimer() {
            clearTimeout(state.interactionTimer);
            if (state.panelOpen) {
                state.interactionTimer = setTimeout(() => {
                    closePanel();
                }, 5000);
            }
        }

        /* ==========================================
           VOLUME, BRIGHTNESS, ASPECT RATIO
           ========================================== */
        function applyVolume(val, showUI = true) {
            state.volume = val;
            video.volume = val / 100;
            volSlider.value = val;
            volVal.textContent = `${val}%`;
            localStorage.setItem(STORAGE_KEYS.VOLUME, val);
            if (showUI) showWidget(volWidget);
        }

        function applyBrightness(val, showUI = true) {
            state.brightness = val;
            const opacity = 1 - (val / 100);
            brightnessOverlay.style.opacity = opacity;
            brightSlider.value = val;
            brightVal.textContent = `${val}%`;
            localStorage.setItem(STORAGE_KEYS.BRIGHTNESS, val);
            if (showUI) showWidget(brightWidget);
        }

        function applyAspectRatio() {
            const mode = ASPECT_RATIOS[state.aspectRatioIndex];
            video.className = `ar-${mode}`;
            document.getElementById('rm-aspect').textContent = `📺 ${mode.toUpperCase()}`;
            localStorage.setItem(STORAGE_KEYS.ASPECT_RATIO, state.aspectRatioIndex);
        }

        function cycleAspectRatio() {
            state.aspectRatioIndex = (state.aspectRatioIndex + 1) % ASPECT_RATIOS.length;
            applyAspectRatio();
            registerActivity();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
            registerActivity();
        }

        function showWidget(widgetEl) {
            brightWidget.classList.remove('show');
            volWidget.classList.remove('show');
            widgetEl.classList.add('show');
            showFloatingControls();
        }

        /* ==========================================
           EVENT LISTENERS & TOUCH GESTURES
           ========================================== */
        function initEventListeners() {
            // General Activity Listener for Mouse / TV Controls
            window.addEventListener('mousemove', registerActivity);

            // Keyboard & Smart TV Navigation
            document.addEventListener('keydown', (e) => {
                registerActivity();

                switch (e.key) {
                    case 'ArrowUp':
                        if (!state.panelOpen) playChannel(state.currentIndex - 1);
                        break;
                    case 'ArrowDown':
                        if (!state.panelOpen) playChannel(state.currentIndex + 1);
                        break;
                    case 'ArrowLeft':
                        if (!state.panelOpen) openPanel();
                        break;
                    case 'ArrowRight':
                        if (state.panelOpen) closePanel();
                        break;
                    case 'Escape':
                    case 'Backspace':
                        if (state.panelOpen) {
                            closePanel();
                        } else if (document.fullscreenElement) {
                            document.exitFullscreen();
                        } else if (state.controlsVisible) {
                            hideFloatingControls();
                        }
                        break;
                }
            });

            // Touch Gestures for Mobile (Swipe UP/DOWN, Single Tap, Double Tap)
            document.addEventListener('touchstart', (e) => {
                state.touchStartY = e.touches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                const diffY = state.touchStartY - touchEndY;

                // Swipe Detection
                if (Math.abs(diffY) > 50 && !state.panelOpen) {
                    if (diffY > 0) {
                        playChannel(state.currentIndex + 1); // Swipe Up -> Next Channel
                    } else {
                        playChannel(state.currentIndex - 1); // Swipe Down -> Prev Channel
                    }
                    return;
                }

                // Single / Double Tap Controls Toggle
                const currentTime = new Date().getTime();
                const tapLength = currentTime - state.lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    // Double Tap: Toggle controls immediately
                    if (state.controlsVisible) {
                        hideFloatingControls();
                    } else {
                        showFloatingControls();
                    }
                    e.preventDefault();
                } else {
                    // Single Tap: Show controls & reset timer if visible
                    if (!state.controlsVisible) {
                        showFloatingControls();
                    } else {
                        registerActivity();
                    }
                }
                state.lastTapTime = currentTime;
            });

            // On-Screen Remote Buttons
            document.getElementById('rm-prev').addEventListener('click', () => playChannel(state.currentIndex - 1));
            document.getElementById('rm-next').addEventListener('click', () => playChannel(state.currentIndex + 1));
            document.getElementById('rm-list').addEventListener('click', () => openPanel());
            document.getElementById('rm-vol').addEventListener('click', () => showWidget(volWidget));
            document.getElementById('rm-bright').addEventListener('click', () => showWidget(brightWidget));
            document.getElementById('rm-aspect').addEventListener('click', cycleAspectRatio);
            document.getElementById('rm-fullscreen').addEventListener('click', toggleFullscreen);
            document.getElementById('rm-close').addEventListener('click', hideFloatingControls);

            document.getElementById('btn-close-panel').addEventListener('click', closePanel);

            // Sliders
            volSlider.addEventListener('input', (e) => applyVolume(e.target.value));
            brightSlider.addEventListener('input', (e) => applyBrightness(e.target.value));

            // Modal Triggers
            document.getElementById('btn-playlists-modal').addEventListener('click', openModal);
            document.getElementById('btn-modal-close').addEventListener('click', closeModal);
            document.getElementById('btn-modal-save').addEventListener('click', handleModalSave);

            // Browser Back Button Prevention
            window.addEventListener('popstate', (e) => {
                if (state.panelOpen) {
                    closePanel();
                    history.pushState(null, null, window.location.href);
                } else if (document.fullscreenElement) {
                    document.exitFullscreen();
                    history.pushState(null, null, window.location.href);
                } else {
                    if (!confirm("Exit IPTV Player?")) {
                        history.pushState(null, null, window.location.href);
                    }
                }
            });
            history.pushState(null, null, window.location.href);
        }

        /* ==========================================
           PLAYLIST MODAL MANAGEMENT
           ========================================== */
        function openModal() {
            renderModalPlaylists();
            playlistModal.classList.add('open');
        }

        function closeModal() {
            playlistModal.classList.remove('open');
        }

        function renderModalPlaylists() {
            const container = document.getElementById('modal-playlist-list');
            container.innerHTML = '';

            Object.keys(state.playlists).forEach((key) => {
                const item = document.createElement('div');
                item.className = 'playlist-option';
                item.innerHTML = `
                    <span>${key === state.currentPlaylistKey ? '<b>' + key + ' (Active)</b>' : key}</span>
                    <div>
                        <button class="btn-icon btn-secondary btn-sw">Switch</button>
                        <button class="btn-icon btn-danger btn-del">✕</button>
                    </div>
                `;

                item.querySelector('.btn-sw').onclick = () => {
                    state.currentPlaylistKey = key;
                    localStorage.setItem(STORAGE_KEYS.SELECTED_PL, key);
                    loadCurrentPlaylist();
                    closeModal();
                    closePanel();
                };

                item.querySelector('.btn-del').onclick = (e) => {
                    e.stopPropagation();
                    delete state.playlists[key];
                    localStorage.setItem(STORAGE_KEYS.PLAYLISTS, JSON.stringify(state.playlists));
                    if (state.currentPlaylistKey === key) {
                        state.currentPlaylistKey = Object.keys(state.playlists)[0] || '';
                        localStorage.setItem(STORAGE_KEYS.SELECTED_PL, state.currentPlaylistKey);
                    }
                    renderModalPlaylists();
                };

                container.appendChild(item);
            });
        }

        function handleModalSave() {
            const name = document.getElementById('pl-name-input').value.trim() || `Playlist ${Date.now()}`;
            const url = document.getElementById('pl-url-input').value.trim();
            const fileInput = document.getElementById('pl-file-input');

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    parseAndSaveM3U(e.target.result, name, '', true);
                    closeModal();
                    closePanel();
                };
                reader.readAsText(file);
            } else if (url) {
                fetchAndParseM3U(url, name, true);
                closeModal();
                closePanel();
            } else {
                alert("Please provide an M3U URL or select a file.");
            }
        }
    </script>
</body>
